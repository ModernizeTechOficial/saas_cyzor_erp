name: Deploy Laravel - ModernizeTech
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Subdomain for deployment'
        required: true
      db_host:
        description: 'Database host'
        required: true
        default: 'localhost'
      db_database:
        description: 'Database name'
        required: true
      db_username:
        description: 'Database username'
        required: true
      db_password:
        description: 'Database password (will be masked)'
        required: true
        type: string      
      repository_url:
        description: 'Repository SSH URL'
        required: true
        default: 'git@github.com:ModernizeTechOficial/saas_cyzor_erp.git'
      sql_file_path:
        description: 'SQL dump path inside repo'
        required: false
        default: 'database/dump.sql'
      purchase_id:
        description: 'Purchase ID'
        required: false
        default: 'não encontrado'
      ssh_key_name:
        description: 'SSH key filename on server (e.g. cyzor_erp)'
        required: false
        default: 'cyzor_erp'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PURCHASE_ID: ${{ inputs.purchase_id }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      SSH_KEY_NAME: ${{ inputs.ssh_key_name }}
      API_URL: https://cyzor.com.br/api/github/deploy-step

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Notify API - Deploy Started
        run: |
          curl -X POST "https://cyzor.com.br/api/github/webhook" \
            -H "Content-Type: application/json" \
            -d '{
              "purchase_id": "${{ env.PURCHASE_ID }}",
              "subdomain": "${{ env.SUBDOMAIN }}"
            }'

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_RSA }}" > ~/.ssh/${{ env.SSH_KEY_NAME }}
          chmod 600 ~/.ssh/${{ env.SSH_KEY_NAME }}
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Server (Real-time Steps)
        env:
          # Pass all inputs securely as environment variables
          DB_HOST: ${{ inputs.db_host }}
          DB_DATABASE: ${{ inputs.db_database }}
          DB_USERNAME: ${{ inputs.db_username }}
          DB_PASSWORD: ${{ inputs.db_password }}
          REPO_URL: ${{ inputs.repository_url }}
          SQL_FILE_PATH: ${{ inputs.sql_file_path }}
        run: |
          # Use UNQUOTED << EOF so variables expand locally first
          ssh -i ~/.ssh/${{ env.SSH_KEY_NAME }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            set -e

            notify() {
              PERCENT=\$3
              curl -X POST "${{ env.API_URL }}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"purchase_id\": \"${{ env.PURCHASE_ID }}\",
                  \"subdomain\": \"${{ env.SUBDOMAIN }}\",
                  \"step\": \"\$1\",
                  \"status\": \"\$2\",
                  \"percent\": \${PERCENT:-null}
                }" || true
            }

            notify "Iniciando deploy" "in_progress" 5

            TARGET_DIR="/home/${{ inputs.subdomain }}/public_html"
            mkdir -p "\$TARGET_DIR"
            cd "\$TARGET_DIR"

            # Backup
            notify "Fazendo backup" "in_progress" 10
            if [ -n "\$(ls -A . 2>/dev/null)" ]; then
              BACKUP_FILE="../backup_\$(date +%F_%H-%M-%S).tar.gz"
              tar -czf "\$BACKUP_FILE" ./* && rm -rf ./*
              notify "Backup salvo como \$(basename \$BACKUP_FILE)" "completed" 15
            else
              notify "Diretório vazio, sem backup" "skipped" 15
            fi

            # Clone repository
            notify "Clonando repositório" "in_progress" 20
            git clone "${{ inputs.repository_url }}" . 
            notify "Repositório clonado" "completed" 25

            # .env
            notify "Configurando .env" "in_progress" 30
            cp .env.example .env
            sed -i "s|APP_URL=.*|APP_URL=https://${{ inputs.subdomain }}|g" .env
            sed -i "s|DB_HOST=.*|DB_HOST=${{ inputs.db_host }}|g" .env
            sed -i "s|DB_DATABASE=.*|DB_DATABASE=${{ inputs.db_database }}|g" .env
            sed -i "s|DB_USERNAME=.*|DB_USERNAME=${{ inputs.db_username }}|g" .env
            sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ inputs.db_password }}|g" .env
            notify ".env configurado" "completed" 35

            # Virtual Host (LiteSpeed)
            notify "Configurando Virtual Host" "in_progress" 40
            if [ -f ".github/templates/vhconf.template" ]; then
              sudo mkdir -p "/usr/local/lsws/conf/vhosts/${{ inputs.subdomain }}"
              sudo cp ".github/templates/vhconf.template" "/usr/local/lsws/conf/vhosts/${{ inputs.subdomain }}/vhconf.conf"
              sudo sed -i "s|{{DOMAIN}}|${{ inputs.subdomain }}|g" "/usr/local/lsws/conf/vhosts/${{ inputs.subdomain }}/vhconf.conf"
              sudo sed -i "s|{{PUBLIC_DIR}}|\$TARGET_DIR/public|g" "/usr/local/lsws/conf/vhosts/${{ inputs.subdomain }}/vhconf.conf"
              sudo /usr/local/lsws/bin/lswsctrl reload
            fi
            notify "Virtual Host aplicado" "completed" 45

            # Permissions
            notify "Ajustando permissões" "in_progress" 50
            OWNER=\$(stat -c '%U' ..)
            sudo chown -R "\$OWNER:\$OWNER" .
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;
            chmod -R 775 storage bootstrap/cache
            notify "Permissões corrigidas" "completed" 55

            # Dependencies
            notify "Instalando dependências" "in_progress" 60
            composer install --no-dev --optimize-autoloader --no-interaction
            [ -f "package.json" ] && npm ci && npm run prod
            notify "Dependências instaladas" "completed" 70

            # Laravel setup
            notify "Executando comandos Laravel" "in_progress" 75
            php artisan key:generate --force
            php artisan storage:link
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            notify "Laravel otimizado" "completed" 80

            # Database import
            notify "Importando banco de dados" "in_progress" 85
            SQL_FILE="${{ inputs.sql_file_path }}"
            if [ -f "\$SQL_FILE" ]; then
              mysql -h "${{ inputs.db_host }}" \
                    -u "${{ inputs.db_username }}" \
                    -p"${{ inputs.db_password }}" \
                    "${{ inputs.db_database }}" < "\$SQL_FILE"
              notify "Banco de dados importado" "completed" 90
            else
              notify "Arquivo SQL não encontrado: \$SQL_FILE" "skipped" 90
            fi

            # Final reload
            php artisan optimize:clear 2>/dev/null || true
            sudo /usr/local/lsws/bin/lswsctrl reload

            notify "Deploy concluído com sucesso!" "completed" 100
          EOF

      - name: Notify API - Final Success
        if: success()
        run: |
          curl -X POST "${{ env.API_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "purchase_id": "${{ env.PURCHASE_ID }}",
              "subdomain": "${{ env.SUBDOMAIN }}",
              "step": "Deploy finalizado",
              "status": "completed",
              "percent": 100
            }'

      - name: Notify API - Failure
        if: failure()
        run: |
          curl -X POST "${{ env.API_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "purchase_id": "${{ env.PURCHASE_ID }}",
              "subdomain": "${{ env.SUBDOMAIN }}",
              "step": "Erro no deploy",
              "status": "failed",
              "percent": 0
            }'
